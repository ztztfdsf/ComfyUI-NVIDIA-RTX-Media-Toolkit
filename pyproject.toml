[project]
name = "ComfyUI-NVVFX-Pro"
version = "1.0.0"
description = "NVIDIA RTX Video Super Resolution (2x/3x/4x, 6 models) + RIFE frame interpolation (2x/4x/8x) for ComfyUI. DLSS-style quality tiers (DLAA..Ultra Performance) x presets (A..M), FPS multiplier, per-architecture (RTX 20/30/40/50) model auto-download."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.20",
    "numpy",
    "opencv-python-headless>=4.5",
]

[tool.comfy]
PublisherId = "ztztfdsf"
DisplayName = "ComfyUI-NVVFX-Pro"
Icon = "icon.png"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
