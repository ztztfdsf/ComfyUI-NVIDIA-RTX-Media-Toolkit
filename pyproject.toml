[project]
name = "ComfyUI-NVIDIA-RTX-Media-Toolkit"
version = "1.1.0"
description = "NVIDIA RTX media toolkit for ComfyUI: VSR video super-resolution, DLISR AI photo upscale (2x/4x/8x) and RIFE frame interpolation, all on the driver NGX pipeline. RTX 20-50 series, models auto-download."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.20",
    "numpy",
    "opencv-python-headless>=4.5",
]

[tool.comfy]
PublisherId = "ztztfdsf"
DisplayName = "ComfyUI-NVIDIA-RTX-Media-Toolkit"
Icon = "icon.png"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
